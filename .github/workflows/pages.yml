name: Browser Lab Pages

on:
  push:
    branches: [v1.x-maintenance]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MiniExcel
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish .NET Browser Lab
        run: dotnet publish samples/MiniExcel.Samples.Blazor/MiniExcel.Samples.Blazor.csproj --configuration Release --output artifacts/blazor-pages
      - name: Prepare GitHub Pages files
        run: |
          touch artifacts/blazor-pages/wwwroot/.nojekyll
          cp artifacts/blazor-pages/wwwroot/index.html artifacts/blazor-pages/wwwroot/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/blazor-pages/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4