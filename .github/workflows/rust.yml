name: Rust

on:
  pull_request:
    paths:
      - "rust/**"
      - "tests/data/xlsx/**"
      - "tests/data/contracts/**"
      - "tests/MiniExcel.OpenXml.Tests/Compatibility/RustParityContractTests.cs"
      - ".github/workflows/rust.yml"
  push:
    branches: [master]
    paths:
      - "rust/**"
      - "tests/data/xlsx/**"
      - "tests/data/contracts/**"
      - "tests/MiniExcel.OpenXml.Tests/Compatibility/RustParityContractTests.cs"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Build documentation
        run: cargo doc --manifest-path rust/Cargo.toml --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked

  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: browser-wasm
      - name: Install wasm-bindgen CLI
        run: cargo +stable install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        working-directory: rust/web-demo
        run: npm ci
      - name: Build browser demo
        working-directory: rust/web-demo
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: rust/web-demo
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: rust/web-demo
        run: npm run test:e2e

  dotnet-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run shared XLSX parity contract
        run: >-
          dotnet test tests/MiniExcel.OpenXml.Tests/MiniExcel.OpenXml.Tests.csproj
          --framework net10.0
          --filter "FullyQualifiedName~RustParityContractTests"
          --verbosity minimal

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: msrv
      - name: Check minimum supported Rust version
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked