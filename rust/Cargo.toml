[workspace]
members = ["miniexcel", "miniexcel-cli", "miniexcel-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/mini-software/MiniExcel"
homepage = "https://github.com/mini-software/MiniExcel"

[workspace.dependencies]
calamine = { version = "0.35.0", features = ["chrono"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
console_error_panic_hook = "0.1.7"
indexmap = "2.12.1"
quick-xml = "0.39.4"
rust_xlsxwriter = { version = "0.96.0", features = ["chrono", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
wasm-bindgen = "0.2.127"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"